name: Keep Warm

# Pings the backend /health every ~5 min so the Railway service doesn't go cold.
# Why: the heaviest request (the About You reading — ~10-18s of Claude) is the
# one that 503s on a cold start, exactly when a user is waiting on it. A steady
# heartbeat keeps the dyno warm so the first real request isn't paying the
# cold-start penalty.
#
# NOTE: GitHub's scheduler is best-effort (min granularity 5 min, and it can lag
# several minutes under load). UptimeRobot already pings /health on its own
# interval (see project infra), so this is additive redundancy. For a hard
# guarantee, tighten the UptimeRobot interval or disable Railway scale-to-idle —
# this cron is the cheap, in-repo belt-and-suspenders.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # allow a manual warm-up before a demo

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        run: |
          code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 30 \
            https://haveniq-backend-production.up.railway.app/health)
          echo "health → HTTP $code"
          test "$code" = "200"
